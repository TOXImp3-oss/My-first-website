<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поймай свет</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at top,#282052,#080914 75%);
 color:white;font-family:Arial,sans-serif;
}
.game{
 width:100%;max-width:440px;padding:28px 22px;
 background:#15162b;border:1px solid #6652a7;
 border-radius:24px;text-align:center;
 box-shadow:0 0 60px #7655ff22;
}
.logo{color:#ad9aff;letter-spacing:4px;font-size:11px}
h1{font-size:34px;margin:20px 0 10px}
p{color:#b9bad0;line-height:1.5}
.stats{display:flex;justify-content:space-around;margin:25px 0}
.stat{color:#aaa;font-size:13px}
.stat strong{display:block;color:white;font-size:25px;margin-top:7px}
.arena{
 height:310px;position:relative;
 background:#0d1024;border:1px solid #35335d;
 border-radius:17px;overflow:hidden;margin:20px 0;
}
.target{
 position:absolute;width:65px;height:65px;
 border:0;border-radius:50%;
 background:radial-gradient(circle,#fff,#b9a0ff 25%,#824bff 55%,#4220a0);
 box-shadow:0 0 20px #9c66ff,0 0 45px #8b45ff;
 cursor:pointer;display:none;
 transform:translate(-50%,-50%);
}
button.start{
 border:0;border-radius:12px;padding:16px 30px;
 background:linear-gradient(100deg,#785aff,#b04cff);
 color:white;font-size:16px;font-weight:bold;
 cursor:pointer;
}
.hidden{display:none}
#result{font-size:24px;color:#c4aaff}
</style>
</head>
<body>
<div class="game">
 <div class="logo">NEON ARCADE · 001</div>
 <h1>Поймай свет ⚡</h1>
 <p>Лови светящийся шар как можно быстрее!</p>

 <div class="stats">
  <div class="stat">ОЧКИ<strong id="score">0</strong></div>
  <div class="stat">ВРЕМЯ<strong id="time">30</strong></div>
  <div class="stat">РЕКОРД<strong id="best">0</strong></div>
 </div>

 <div class="arena" id="arena">
  <button class="target" id="target" aria-label="Поймать свет"></button>
  <div id="hint" style="padding-top:125px;color:#aaa">
   Здесь появится цель
  </div>
 </div>

 <div id="result">Готов играть?</div>
 <p id="message">У тебя есть 30 секунд!</p>
 <button class="start" id="start" onclick="startGame()">НАЧАТЬ ИГРУ</button>
</div>

<script>
let score=0,time=30,best=Number(localStorage.getItem("neonBest"))||0;
let active=false,clock=null;

const target=document.getElementById("target");
const arena=document.getElementById("arena");

document.getElementById("best").textContent=best;

function moveTarget(){
 const maxX=arena.clientWidth-75;
 const maxY=arena.clientHeight-75;
 target.style.left=(35+Math.random()*maxX)+"px";
 target.style.top=(35+Math.random()*maxY)+"px";
}

function startGame(){
 score=0;time=30;active=true;
 document.getElementById("score").textContent=score;
 document.getElementById("time").textContent=time;
 document.getElementById("result").textContent="Лови свет!";
 document.getElementById("message").textContent="Быстрее!";
 document.getElementById("start").classList.add("hidden");
 document.getElementById("hint").classList.add("hidden");
 target.style.display="block";
 moveTarget();

 clearInterval(clock);
 clock=setInterval(()=>{
  time--;
  document.getElementById("time").textContent=time;
  if(time<=0)endGame();
 },1000);
}

target.addEventListener("click",()=>{
 if(!active)return;
 score++;
 document.getElementById("score").textContent=score;
 moveTarget();
});

function endGame(){
 active=false;
 clearInterval(clock);
 target.style.display="none";
 document.getElementById("result").textContent="Твой результат: "+score+" ⚡";
 document.getElementById("message").textContent=
 score>best?"Новый рекорд! Поздравляем!":"Попробуй побить свой рекорд!";
 if(score>best){
  best=score;
  localStorage.setItem("neonBest",best);
  document.getElementById("best").textContent=best;
 }
 document.getElementById("start").textContent="ИГРАТЬ СНОВА";
 document.getElementById("start").classList.remove("hidden");
 document.getElementById("hint").classList.remove("hidden");
 document.getElementById("hint").textContent="Игра окончена";
}
</script>
</body>
</html>
